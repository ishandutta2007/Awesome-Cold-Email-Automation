<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#1a102f" />
    </linearGradient>

    <!-- Accent Gradient for Text & Glows -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #00f2fe;
    }
    
    /* Dynamic Animation Effects */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }

    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }

    @keyframes dashFlow {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .pulsing-orb-1 { animation: pulseGlow 6s infinite ease-in-out; transform-origin: 200px 100px; }
    .pulsing-orb-2 { animation: pulseGlow 8s infinite ease-in-out 2s; transform-origin: 1000px 220px; }
    .floating-node-1 { animation: floatParticle 5s infinite ease-in-out; }
    .floating-node-2 { animation: floatParticle 7s infinite ease-in-out 1s; }
    .floating-node-3 { animation: floatParticle 6s infinite ease-in-out 2.5s; }
    .flowing-path { stroke-dasharray: 10 15; animation: dashFlow 20s linear infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGradient)" />
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="pulsing-orb-1" cx="200" cy="80" r="140" fill="#00f2fe" opacity="0.15" filter="url(#glow)" />
  <circle class="pulsing-orb-2" cx="1020" cy="240" r="160" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Dynamic Background Lines -->
  <path class="flowing-path" d="M -50 220 Q 300 80 600 220 T 1250 120" fill="none" stroke="url(#lineGradient)" stroke-width="2" />
  <path class="flowing-path" d="M -50 100 Q 400 280 800 100 T 1250 260" fill="none" stroke="url(#lineGradient)" stroke-width="1.5" opacity="0.7" />

  <!-- Animated Dynamic Floating Particle Icons/Nodes in Background -->
  <g class="floating-node-1">
    <circle cx="150" cy="230" r="4" fill="#00f2fe" opacity="0.6" />
    <circle cx="150" cy="230" r="12" fill="none" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
  </g>

  <g class="floating-node-2">
    <circle cx="1060" cy="90" r="5" fill="#a855f7" opacity="0.7" />
    <circle cx="1060" cy="90" r="16" fill="none" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
  </g>

  <g class="floating-node-3">
    <circle cx="920" cy="260" r="3" fill="#3b82f6" opacity="0.8" />
  </g>

  <!-- Foreground Main Title & Subtitle Container (Guaranteed Clear Legibility) -->
  <g transform="translate(80, 80)">
    
    <!-- Top Pill Badge -->
    <rect width="210" height="30" rx="15" fill="url(#cardBg)" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1" />
    <text x="18" y="20" class="badge-text">⚡ COLD OUTREACH 2026</text>

    <!-- Main Title -->
    <text x="0" y="82" class="title-text" filter="url(#glow)">Awesome Cold Email Automation</text>
    
    <!-- Subtitle -->
    <text x="0" y="122" class="subtitle-text">Curated SaaS Platforms • Open-Source Engines • Inbox Warmup • Deliverability</text>
    
    <!-- Feature Chips/Pills -->
    <g transform="translate(0, 150)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="14" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8">📊 10+ SaaS Ranked</text>

      <!-- Chip 2 -->
      <rect x="175" y="0" width="180" height="32" rx="8" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="189" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc">⭐ 18+ Open Source</text>

      <!-- Chip 3 -->
      <rect x="370" y="0" width="200" height="32" rx="8" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.15" />
      <text x="384" y="21" font-family="sans-serif" font-size="13" font-weight="600" fill="#4ade80">🛡️ Deliverability &amp; Warmup</text>
    </g>

  </g>
</svg>
